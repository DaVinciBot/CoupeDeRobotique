name: Lint

on: [push, pull_request]
permissions:
  contents: write
  actions: read
  checks: write

jobs:
  format:
    name: Ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff format
        run: ruff format || true
      - name: Commit changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: ruff auto-fix & format"
          commit_user_name: "DaVinci Bot"
          commit_user_email: "davincibot@devinci.fr"
          branch: ${{ github.head_ref || github.ref_name }}

  baselines:
    name: Generate linter baselines (pip, commandes séparées)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # baselines seulement sur push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Ruff
        run: pip install ruff

      - name: Install pydoclint
        run: pip install pydoclint

      - name: Install pylint
        run: pip install pylint

      - name: Install pyright (bundled Node)
        run: pip install "pyright[nodejs]"
        continue-on-error: true

      - name: Ruff baseline (check --fix)
        run: ruff check . --fix > ruff-baseline.txt
        continue-on-error: true

      - name: Pydoclint (console only)
        run: pydoclint .
        continue-on-error: true

      - name: Pylint baseline
        run: pylint --output=pylint-baseline.txt .
        continue-on-error: true

      - name: Pyright baseline (JSON)
        run: pyright --outputjson > pyright-baseline.json
        continue-on-error: true

      - name: Commit changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate baselines"
          commit_user_name: "DaVinci Bot"
          commit_user_email: "davincibot@devinci.fr"
          branch: ${{ github.head_ref || github.ref_name }}
