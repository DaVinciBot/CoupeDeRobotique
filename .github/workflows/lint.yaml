name: Lint

on: [push, pull_request]
permissions:
  contents: write
  actions: read
  checks: write

jobs:
  ruff:
    name: Ruff (check --fix + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff check --fix & format
        run: |
          ruff check --fix
          ruff format
      - name: Commit changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: ruff auto-fix & format"
          commit_user_name: "DaVinci Bot"
          commit_user_email: "davincibot@devinci.fr"
          branch: ${{ github.head_ref || github.ref_name }}

  baselines:
    name: Generate linter baselines
    runs-on: ubuntu-latest
    needs: ruff
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff pydoclint pylint pyright
      - name: Run make lint (generate baselines)
        run: |
          make lint || true
      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-lint-baselines
          path: |
            pydoclint-baseline.txt
            pylint-baseline.txt
            pyright-baseline.json
            ruff-baseline.txt
          if-no-files-found: warn
