name: Lint

on: [push, pull_request]
permissions:
  contents: write
  actions: read
  checks: write

jobs:
  format:
    name: Ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff format
        run: ruff format || true
      - name: Commit changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: ruff auto-fix & format"
          commit_user_name: "DaVinci Bot"
          commit_user_email: "davincibot@devinci.fr"
          branch: ${{ github.head_ref || github.ref_name }}
