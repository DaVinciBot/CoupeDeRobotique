[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
dependencies = [
  "aiohttp==3.11.12",
  "aiosignal==1.3.2",
  "attrs==25.1.0",
  "colorama==0.4.6",
  "crc8==0.2.0",
  "dotenv>=0.9.9",
  "events==0.5",
  "frozenlist==1.5.0",
  "future==1.0.0",
  "gpiozero==2.0.1",
  "graphviz==0.20.3",
  "idna==3.10",
  "iso8601==2.1.0",
  "loggerplusplus==0.1.5",
  "matplotlib>=3.7.0",
  "multidict==6.1.0",
  "networkx==3.4.2",
  "numpy==2.2.2",
  "opencv-contrib-python>=4.8.0",
  "opencv-python==4.12.0.88",
  "ortools==9.12.4544",
  "pathfinding==1.0.16",
  "pyserial==3.5",
  "pysicktim==0.0.9",
  "python-dotenv>=1.0.0",
  "pyusb==1.2.1",
  "pyyaml==6.0.1",
  "scipy==1.15.2",
  "shapely==2.1.1",
  "taskbrain==0.1.8",
  "wscomms==0.1.6",
  "yarl==1.18.3",
]
description = "Robot control software for Coupe De Robotique."
name = "CoupeDeRobotique"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[dependency-groups]
dev = [
  "isort>=6.0.1",
  "mypy>=1.17.1",
  "pdoc>=15.0.4",
  "pre-commit>=4.3.0",
  "pydoclint>=0.6.8",
  "pylint>=3.3.8",
  "pyright>=1.1.405",
  "pytest>=8.4.1",
  "ruff>=0.12.8",
  "types-shapely>=2.1.0.20250915",
]

[tool.isort]
known_first_party = [
  "a_config_loader",
  "arena",
  "avoidance",
  "boombot_strategy",
  "brains",
  "common",
  "controllers",
  "debug_functions",
  "geometry",
  "gpio",
  "led_strip",
  "navigation",
  "navigator",
  "path_planner",
  "rasp",
  "remote",
  "robot1",
  "sensors",
  "strategies",
  "strategy",
  "sub_graphs",
  "tasks",
  "teensy",
  "trajectory_planner",
  "usb_com",
  "utils",
  "video",
]
profile = "black"
skip_glob = [
  "**/common/navigation/avoidance/__init__.py",
  "**/common/navigation/path_planner/__init__.py",
  "**/robot1/rasp/controllers/actuators/__init__.py",
  "**/.venv/**",
]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
plugins = "mypy-type-checker"
pretty = true
python_version = "3.13"
show_error_codes = true
strict = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = false

[tool.pydoclint]
allow-init-docstring = true
baseline = "pydoclint-baseline.txt"
check-style-mismatch = true
exclude = '\.venv'
generate-baseline = true
show-filenames-in-every-violation-message = true
skip-checking-short-docstrings = false
style = 'google'

[tool.pylint.main]
disable = [
  "C0114", # missing-module-docstring -> Best management with ruff
  "C0301", # line-too-long -> Best management with ruff
  "C0415", # import-outside-toplevel -> Best management with ruff
  "E0401", # import-error -> False positive
  "E1101", # no-member -> False positive
  "I0011", # locally-disabled
  "I0020", # suppressed-message
  "R0801", # duplicate-code
  "R0902", # too-many-instance-attributes
  "R0903", # too-few-public-methods
  "R0913", # too-many-arguments
  "R0914", # too-many-locals
  "R0915", # too-many-statements
  "R0917", # too-many-positional-arguments
  "W0212", # protected-access -> Best management with ruff
  "W0511", # fixme
  "W0611", # unused-import -> Best management with pyright and ruff
  "W0613", # unused-argument -> Best management with ruff
  "W0718", # broad-exception-caught -> Best management with ruff
  "W1113", # keyword-arg-before-vararg -> Best management with ruff
]
enable = "all"
exit-zero = true
ignore = [".venv", "docs"]
msg-template = "{line}:{column}: {msg_id}: {msg} ({symbol})"
output-format = "text"

[tool.pylint.logging]
logging-format-style = "new"
logging-modules = ["loggerplusplus"]

[tool.pylint.miscellaneous]
notes = [
  "BUG",
  "FIX",
  "FIXIT",
  "FIXME",
  "HACK",
  "QUESTION",
  "TODO",
  "UNUSED",
  "[ ]",
  "[x]",
]

[tool.pyright]
exclude = [
  "**/.venv",
  "**/__pycache__",
  "**/node_modules",
]
extraPaths = ["./.venv/Lib/site-packages", "common", "robot1"]
include = ["common", "robot1"]
reportCallInDefaultInitializer = "error"
reportConstantRedefinition = "warning"
reportDeprecated = "warning"
reportImplicitOverride = "information"
reportImportCycles = "warning"
reportInconsistentConstructor = "information"
reportMatchNotExhaustive = "warning"
reportMissingImports = "warning"
reportMissingModuleSource = "information"
reportMissingParameterType = "information"
reportMissingTypeArgument = "information"
reportPossiblyUnboundVariable = "none"
reportPrivateImportUsage = "none"
reportPrivateUsage = "information"
reportPropertyTypeMismatch = "warning"
reportShadowedImports = "warning"
reportUninitializedInstanceVariable = "information"
reportUnknownVariableType = "information"
reportUnnecessaryCast = "information"
reportUnnecessaryComparison = "information"
reportUnnecessaryContains = "information"
reportUnnecessaryIsInstance = "information"
reportUnnecessaryTypeIgnoreComment = "information"
reportUnreachable = "warning"
reportUntypedBaseClass = "error"
reportUntypedClassDecorator = "error"
reportUntypedNamedTuple = "error"
reportUnusedClass = "information"
reportUnusedExpression = "information"
reportUnusedFunction = "information"
reportUnusedImport = "information"
typeCheckingMode = "standard"

[tool.ruff]
exclude = [
  "**/.venv/**",
  "**/2024_mars_arena/**",
  "**/docs/**",
  "*.ipynb",
]
fix = true
indent-width = 4
line-length = 88
output-format = "grouped"
preview = true
show-fixes = true
target-version = "py313"
unsafe-fixes = false

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
ignore = [
  "ASYNC110", # async-busy-wait
  "B024", # abstract-base-class-without-abstract-method
  "CPY001", # missing-copyright-notice
  "EXE002", # shebang-missing-executable-file
  "FIX002", # line-contains-todo
  "FIX004", # line-contains-hack
  "G004", # logging-f-string
  "PLR0917", # too-many-positional-arguments
  "PLR0913", # too-many-arguments
  "S104", # hardcoded-bind-all-interfaces
  "S404", # suspicious-subprocess-import
  "TD001", # invalid-todo-tag
  "TD002", # missing-todo-author
  "TD003", # missing-todo-link
  "TRY400", # error-instead-of-exception
]
select = ["ALL"]
exclude = [
  "**/.venv/**",
  "**/2024_mars_arena/**",
  "**/docs/**",
]

[tool.ruff.lint.isort]
known-first-party = [
  "a_config_loader",
  "arena",
  "avoidance",
  "boombot_strategy",
  "brains",
  "common",
  "controllers",
  "debug_functions",
  "geometry",
  "gpio",
  "led_strip",
  "navigation",
  "navigator",
  "path_planner",
  "rasp",
  "remote",
  "robot1",
  "sensors",
  "strategies",
  "strategy",
  "sub_graphs",
  "tasks",
  "teensy",
  "trajectory_planner",
  "usb_com",
  "utils",
  "video",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
packages = [
  "a_config_loader",
  "arena",
  "boombot_strategy",
  "brains",
  "common",
  "controllers",
  "geometry",
  "gpio",
  "led_strip",
  "navigation",
  "rasp",
  "robot1",
  "sensors",
  "strategy",
  "teensy",
  "usb_com",
  "utils",
  "video",
]
package-dir = { "common" = "common", "arena" = "common/arena", "geometry" = "common/geometry","gpio" = "common/gpio", "led_strip" = "common/led_strip", "navigation"= "common/navigation", "strategy" = "common/strategy", "teensy" = "common/teensy", "usb_com" = "common/usb_com", "utils" = "common/utils", "video" = "common/video", "rasp" = "robot1/rasp", "a_config_loader" = "robot1/rasp/a_config_loader", "boombot_strategy" = "robot1/rasp/boombot_strategy", "brains" = "robot1/rasp/brains", "controllers" = "robot1/rasp/controllers", "sensors" = "robot1/rasp/sensors" }
