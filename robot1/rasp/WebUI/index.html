<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/style/roboto.css" />
    <link rel="stylesheet" href="./assets/style/icons.css" />
    <link rel="stylesheet" href="./assets/style/dpad.css" />
    <link rel="stylesheet" href="./assets/style/inter.css" />
    <link rel="stylesheet" href="./assets/style/bento.css" />
    <link rel="stylesheet" href="./page/map.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./page/cam.css" />
    <link rel="shortcut icon" href="./assets/fav.ico" type="image/x-icon" />
    <title>CDR Dashboard</title>
    <script src="utils.js"></script>
  </head>

  <body>
    <div class="websocket_status" id="websocket_status">
      <div class="websocket_info">
        <span class="loading-spinner"></span>
        <p>En attente de connexion avec le serveur...</p>
      </div>
    </div>
    <div class="website" id="website">
      <!-- Sidebar -->
      <div class="menu sushi">
        <a onclick="set_page('main')" id="main_menu" class="item_menu active"><i class="menu_icon icon" aria-hidden="true"></i>Général</a>
        <a onclick="set_page('map_content')" id="map_content_menu" class="item_menu"><i class="map_icon icon"></i>Map</a>
        <a onclick="set_page('cam')" id="cam_menu" class="item_menu"><i class="cam_icon icon"></i>Caméra</a>
        <a onclick="set_page('start')" id="start_menu" class="item_menu"><i class="save_icon icon"></i>Start</a>
        <a onclick="set_page('settings')" id="settings_menu" class="item_menu"><i class="settings_icon icon"></i>Settings</a>
      </div>
      <div class="main content" id="main">
        <!-- <div class="subgrid">
                                  <div class="sushi">
                                      <div class="pilule">BAU</div>
                                      <div id="bau_state"
                                          style="margin-top: 40px; background-color: red; padding: 10px; border-radius: 20px; color: white; font-weight: bold; text-align: center;">
                                          ACTIVATED
                                      </div>
                                  </div>
                              </div>
              
                              <div class="sushi">
                                  <div class="pilule">PAMI</div>
                                  <div id="pami_states"
                                      style="margin-top: 40px; display: flex; flex-direction: column; gap: 10px;">
                                  </div>
                              </div> -->
        
        <div class="sushi">
          <div class="pilule">Team</div>
          <div style="
                        margin-top: 40px;
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                      ">
            <button class="button" id="blue_team" style="
                          background-color: #005dff;
                          padding: 65px;
                          border-radius: 20px;
                          color: white;
                          font-weight: bold;
                        ">
              Bleu
            </button>
            <button class="button" id="yellow_team" style="
                          background-color: #ffe600;
                          padding: 65px;
                          border-radius: 20px;
                          color: black;
                          font-weight: bold;
                        ">
              Jaune
            </button>
            <!-- <button class="button"
                                  id="other_team"
                                  style="background-color: lightgray; padding: 65px; border-radius: 20px; color: black; font-weight: bold;">
                                  Autre</button> -->
          </div>
        </div>
        
        <div class="sushi">
          <div class="pilule">Timer</div>
          <div id="timer" class="make_center" style="
                        margin-top: 40px;
                        font-size: 100px;
                        background: limegreen;
                        border-radius: 30px;
                        padding: 20px;
                        color: #010132;
                        font-weight: bold;
                        height: calc(100% - 40px);
                      ">
            1:40
          </div>
        </div>
        
        <div class="sushi">
          <div class="pilule">Score</div>
          <div id="score" class="make_center" style="
                        margin-top: 40px;
                        font-size: 100px;
                        font-weight: bold;
                        color: #010132;
                        height: calc(100% - 40px);
                      ">
            0
          </div>
        </div>
        
        <div class="sushi">
          <div class="pilule">Tirette</div>
          <div id="jack_state" style="
                        margin-top: 40px;
                        background-color: limegreen;
                        padding: 10px;
                        border-radius: 20px;
                        color: white;
                        font-weight: bold;
                        text-align: center;
                      ">
            Ready
          </div>
        </div>
      </div>
      <div class="settings content" id="settings"></div>
      <div class="cam content" id="cam">
        <div class="cam_sushi sushi">
          <div class="pilule">
            <i class="icon cam_icon"></i>
            Caméra
          </div>
          <div class="make_center">
            <h1 style="color: white; font-weight: 800; font-size: 50px">
              NO SIGNAL
            </h1>
          </div>
        </div>
      </div>
      <div class="map_content content" id="map_content">
        <div class="map sushi">
          <div class="pilule">
            <i class="icon map_icon"></i>
            Map
          </div>
          <div class="rob">
            <img src="./assets/rob.svg" alt="" />
            <img src="./assets/Rob_logo.png" alt="" />
          </div>
          <div class="bad">
            <img src="./assets/mechant.svg" alt="" />
            <img src="./assets/Crane.svg" alt="" />
          </div>
        </div>
      </div>
      <div class="start content" id="start">
        <div class="start_sushi sushi">
          <div class="pilule">
            <i class="icon compass_icon"></i>
            Start
          </div>
          <div class="make_center">
            <h1 style="color: black; font-weight: 500; font-size: 35px">
              En construction...
            </h1>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
