        <div class="sushi">
            <div class="pilule">Team</div>
            <div
                style="margin-top: 40px; display: flex; flex-direction: column; gap: 10px;">
                <button class="button"
                    id="blue_team"
                    style="background-color: #005DFF; padding: 65px; border-radius: 20px; color: white; font-weight: bold;">
                    Bleu</button>
                <button class="button"
                    id="yellow_team"
                    style="background-color: #FFE600; padding: 65px; border-radius: 20px; color: black; font-weight: bold;">
                    Jaune</button>
                <!-- <button class="button"
                    id="other_team"
                    style="background-color: lightgray; padding: 65px; border-radius: 20px; color: black; font-weight: bold;">
                    Autre</button> -->
            </div>
        </div>

        <div class="sushi">
            <div class="pilule">Timer</div>
            <div id="timer" class="make_center"
                style="margin-top: 40px; font-size: 100px; background: limegreen; border-radius: 30px; padding: 20px; color: #010132; font-weight: bold; height: calc(100% - 40px);">
                1:40
            </div>
        </div>

        <div class="sushi">
            <div class="pilule">Score</div>
            <div id="score" class="make_center"
                style="margin-top: 40px; font-size: 100px; font-weight: bold; color: #010132;height: calc(100% - 40px);">
                46
            </div>
        </div>

        <div class="sushi">
            <div class="pilule">Tirette</div>
            <div id="jack_state"
                style="margin-top: 40px; background-color: limegreen; padding: 10px; border-radius: 20px; color: white; font-weight: bold; text-align: center;">
                Ready
            </div>
        </div>
